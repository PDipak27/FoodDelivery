server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/users/**

        - id: restaurant-service
          uri: ${RESTAURANT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/restaurants/**

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/orders/**

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/payments/**

        - id: delivery-service
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/deliveries/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/notifications/**

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 900000   # 15 minutes

management:
  endpoints:
    web:
      exposure:
        include: health,info
